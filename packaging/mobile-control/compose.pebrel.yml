services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_PATH: /data/relay.sqlite
      ALLOW_LEGACY_WEB_PROXY: 0
      TRUST_PROXY: 0
      SECURE_HANDSHAKE_TIMEOUT_MS: 130000
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - relay-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  relay-data:
