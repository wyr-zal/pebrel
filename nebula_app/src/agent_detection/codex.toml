# Screen-chrome evidence for this CLI (idle / working / blocked).
id = "codex"

# High-confidence startup chrome. This is the cross-host fallback for panes
# whose real process lives behind WSL/SSH and cannot appear in the Windows
# Toolhelp tree. Keep identity signatures brand-specific: status rules such as
# the bare `›` prompt are intentionally too generic to establish identity.
[[identity]]
contains = ["openai codex"]

# A restored conversation can omit the startup banner. Require its branded
# empty prompt immediately followed by the live model/effort footer at the tail.
[[identity]]
regex = ['(?m)^[ \t]*[›»] Ask Codex to do anything[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*[^\r\n]+[ \t]+(?:default|minimal|low|medium|high|xhigh|max|ultra)[ \t]*[·•][^\r\n]*(?:\r?\n[ \t]*\?[ \t]+for shortcuts[^\r\n]*)?\s*\z']

[[rules]]
id = "request_failed"
state = "failed"
priority = 950
region = "bottom_non_empty_lines(12)"
any = [
  { line_regex = ['^■ stream disconnected before completion: .+$'] },
  { line_regex = ['^■ Rate limit exceeded$'] },
  { line_regex = ['^■ [45][0-9][0-9] .+$'] },
]
not = [{ contains = ["esc to interrupt"] }]

[[rules]]
id = "strong_blocker"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(12)"
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
  { contains = ["tab to add notes", "enter to submit"] },
]

[[rules]]
id = "working_status"
state = "working"
priority = 400
region = "bottom_non_empty_lines(16)"
any = [
  { line_regex = ['^[•◦]\s+(?:Working|Compacting context) \([^)]*esc to interrupt\)(?: · .*)?$'] },
  { line_regex = ['^[•◦]\s+Reconnecting(?:\.\.\.|…) [1-9][0-9]*/[1-9][0-9]* \([^)]*[·•] esc to interrupt\)(?: · .*)?$'] },
  { line_regex = ['^[•◦]\s+Messages to be submitted after next tool call \(press esc to interrupt and send immediately\)$'] },
]

# Codex keeps its composer visible while running. Only hooks or verified current
# turn records establish that it has stopped; an empty prompt is not an idle rule.
